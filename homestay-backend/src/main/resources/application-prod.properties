# ============================================
# 生产环境配置（--spring.profiles.active=prod）
# 敏感信息一律通过环境变量注入，缺一不可，缺失即启动失败
# ============================================

# JWT 密钥：部署时 export JWT_SECRET=<64位随机串>（openssl rand -base64 48）
jwt.secret=${JWT_SECRET}

# 数据库：部署时按实际实例配置
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Redis 口令（可为空）
spring.data.redis.password=${REDIS_PASSWORD:}

# 支付宝（生产走正式网关时替换 app-id/gateway-url）
payment.alipay.private-key=${ALIPAY_PRIVATE_KEY:}
payment.alipay.public-key=${ALIPAY_PUBLIC_KEY:}

# 生产环境错误响应不暴露任何内部细节
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
