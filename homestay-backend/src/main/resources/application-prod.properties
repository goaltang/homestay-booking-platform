# ============================================
# 生产环境配置（--spring.profiles.active=prod）
# 敏感信息一律通过环境变量注入，缺一不可，缺失即启动失败
# ============================================

# JWT 密钥：部署时 export JWT_SECRET=<64位随机串>（openssl rand -base64 48）
jwt.secret=${JWT_SECRET}

# 数据库（compose 内用服务名 mysql）
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Redis 口令（可为空）
spring.data.redis.password=${REDIS_PASSWORD:}

# 容器网络：Redis/ES 用 compose 服务名（本地 dev 由 application.properties 覆盖为 localhost）
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.elasticsearch.uris=http://elasticsearch:9200

# RabbitMQ（compose 内用服务名 rabbitmq）
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# 对外访问地址（图片 URL 拼装 / 支付回调回显）
app.server.url=${APP_SERVER_URL:http://localhost:8081}

# 支付宝（生产走正式网关时替换 app-id/gateway-url 为正式值）
payment.alipay.app-id=${ALIPAY_APP_ID:9021000149671635}
payment.alipay.gateway-url=${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
payment.alipay.private-key=${ALIPAY_PRIVATE_KEY:}
payment.alipay.public-key=${ALIPAY_PUBLIC_KEY:}
payment.alipay.notify-url=${ALIPAY_NOTIFY_URL:http://localhost:8081/api/payment/alipay/notify}
payment.alipay.return-url=${ALIPAY_RETURN_URL:http://localhost:5173/orders/pay/success}

# 生产环境错误响应不暴露任何内部细节
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# 文件上传目录（compose 挂载 ./uploads）
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.flyway.clean-disabled=true
# 禁用 Spring SQL init（data.sql 为 Postgres 语法不兼容 MySQL；空库结构由 compose mysql initdb 导入）
spring.sql.init.mode=never
