# =============================================================================
# 性能压测 Profile
# =============================================================================
# 激活方式：
#   mvn spring-boot:run -Dspring-boot.run.profiles=perf
#   java -jar app.jar --spring.profiles.active=perf
#
# 数据源：连 Docker 独立实例（端口 3307 / 6380）
# 库名  ：homestay_perf（与开发库 homestay_db 完全隔离）
#
# ⚠️ 本 profile 严禁用于开发或生产环境
# =============================================================================

# ----- 服务端口 -----
server.port=8080

# ----- 数据源：独立 MySQL（端口 3307） -----
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/homestay_perf?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&rewriteBatchedStatements=true
spring.datasource.username=perf_user
spring.datasource.password=perf_pwd
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ----- JPA / Flyway -----
# ⚠️ 迁移文件不含主表(homestays/users)DDL，全新库跑 Flyway 会失败；
#    改用 Hibernate update 建表（结构与 dev 一致，dev 表即 Hibernate 所建）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=false

# ----- Redis：独立实例（端口 6380） -----
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6380
spring.data.redis.database=0
spring.data.redis.password=
spring.data.redis.timeout=5000
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=5

# ----- 缓存 -----
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=5m

# ----- 业务参数（与 dev 一致；jwt.secret 继承 application.properties 的 dev 值） -----
app.frontend-url=http://localhost:5173
app.earnings.host-share-rate=0.80
order.timeout.pending-hours=2
order.timeout.confirmed-hours=2
order.timeout.payment-pending-hours=2
payment.timeout-minutes=10

# ----- ES：压测环境禁用（避免外部依赖） -----
elasticsearch.enabled=false
spring.data.elasticsearch.repositories.enabled=false

# ----- 邮件：压测环境禁用 -----
spring.mail.host=localhost
spring.mail.port=25

# ----- 支付宝回调：压测用沙箱 -----
payment.alipay.app-id=9021000149671635
payment.alipay.gateway-url=https://openapi-sandbox.dl.alipaydev.com/gateway.do
payment.alipay.notify-url=http://localhost:8081/api/payment/alipay/notify
payment.alipay.return-url=http://localhost:5173/orders/pay/success
payment.alipay.private-key=
payment.alipay.public-key=

# ----- 文件上传 -----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads
file.max-file-size=10485760

# ----- 跨域 -----
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ----- 静态资源 -----
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.mvc.resources.add-mappings=true
spring.mvc.resources.cache.period=0

# ----- Jackson -----
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.default-property-inclusion=NON_NULL

# ----- 错误处理 -----
server.error.include-stacktrace=on_param
server.error.include-message=always

# ----- Actuator + Prometheus（暴露给 Grafana） -----
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=homestay-perf
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# ----- 日志：压测时减少 I/O -----
logging.level.com.homestay3.homestaybackend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.springframework.dao=WARN
logging.level.org.springframework.transaction=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
