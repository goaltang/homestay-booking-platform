<svg viewBox="0 0 1000 560" width="1000" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hs-arch-title hs-arch-desc">
      <title id="hs-arch-title">homestay 后端架构总览</title>
      <desc id="hs-arch-desc">Spring Boot 后端分层架构：接入层、业务层、数据层与基础设施，含 RabbitMQ 延迟/重试队列、Redis 缓存、ES 搜索。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Zones ===== -->
      <rect x="320" y="56" width="360" height="96" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="455" y="60" width="90" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="68" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ACCESS LAYER</text>

      <rect x="104" y="192" width="792" height="96" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="440" y="196" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="204" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BUSINESS LAYER</text>

      <!-- ===== Arrows (before boxes) ===== -->
      <!-- A1 HTTP entry -->
      <path d="M 32,112 H 372" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="152" y="92" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="180" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP / WS</text>

      <!-- A2 Controller -> Service -->
      <path d="M 500,136 V 180 H 232 Q 240,180 240,188 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A3 Service -> MQ -->
      <path d="M 360,248 H 392" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="330" y="228" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="358" y="236" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TX EVENT</text>

      <!-- A4 Service -> Repository -->
      <path d="M 420,272 V 296 H 492 Q 500,296 500,304 V 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A5 Service -> ES (dashed, search) -->
      <path d="M 580,272 V 276 H 852 a 8,8 0 0,0 16,0 H 920 V 388 H 826 a 8,8 0 0,1 -16,0 H 606 V 400" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="724" y="256" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="264" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEARCH</text>

      <!-- A6 Repository -> MySQL -->
      <path d="M 460,368 V 384 H 182 V 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A7 Repository -> Redis (dashed, cache) -->
      <path d="M 540,368 V 396 H 394 V 400" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="484" y="376" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="506" y="384" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE</text>

      <!-- A8 MQ -> RabbitMQ -->
      <path d="M 520,272 V 300 H 818 V 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="636" y="280" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="288" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text>

      <!-- A9 Job -> Service (poll fallback) -->
      <path d="M 860,272 V 316 H 826 a 8,8 0 0,0 -16,0 H 508 a 8,8 0 0,0 -16,0 H 248 Q 240,316 240,308 V 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="280" y="296" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="298" y="304" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRON</text>

      <!-- ===== Nodes ===== -->
      <!-- Controller -->
      <rect x="380" y="88" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="388" y="94" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="402" y="104" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="500" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Controller 接入</text>
      <text x="500" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">REST API · JWT 过滤器</text>

      <!-- Service (focal) -->
      <rect x="120" y="224" width="240" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="128" y="230" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="142" y="240" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="240" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Service 业务层</text>
      <text x="240" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">业务编排 · 事务边界</text>

      <!-- MQ / Event -->
      <rect x="400" y="224" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="230" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="422" y="240" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MQ</text>
      <text x="520" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MQ / Event</text>
      <text x="520" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DLX 延迟 · 重试 · 手动 ack</text>

      <!-- Job -->
      <rect x="680" y="224" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="230" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="704" y="240" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRON</text>
      <text x="780" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Job 定时任务</text>
      <text x="780" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">轮询兜底</text>

      <!-- Repository -->
      <rect x="400" y="320" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="326" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="422" y="336" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
      <text x="500" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Repository</text>
      <text x="500" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Spring Data JPA · Flyway</text>

      <!-- MySQL -->
      <rect x="92" y="400" width="180" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="100" y="406" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="114" y="416" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="182" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MySQL</text>
      <text x="182" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3306 · Flyway 迁移</text>

      <!-- Redis -->
      <rect x="304" y="400" width="180" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="312" y="406" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="328" y="416" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
      <text x="394" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Redis</text>
      <text x="394" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">6379 · 缓存</text>

      <!-- Elasticsearch -->
      <rect x="516" y="400" width="180" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="524" y="406" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="544" y="416" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEARCH</text>
      <text x="606" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Elasticsearch</text>
      <text x="606" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">9200 · IK 分词</text>

      <!-- RabbitMQ (focal) -->
      <rect x="728" y="400" width="180" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="736" y="406" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="750" y="416" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MQ</text>
      <text x="818" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">RabbitMQ</text>
      <text x="818" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5672 · 三场景</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="520" x2="960" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="140" y1="524" x2="172" y2="524" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="180" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SYNC</text>
      <line x1="312" y1="524" x2="344" y2="524" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="352" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ASYNC</text>
      <line x1="484" y1="524" x2="516" y2="524" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="524" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL</text>
      <line x1="656" y1="524" x2="688" y2="524" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="696" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EXTERNAL</text>
    </svg>