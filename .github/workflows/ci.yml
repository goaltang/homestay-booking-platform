name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-test:
    name: Backend Tests (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homestay-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build test ES image (with IK analyzer, needed by EsIntegrationTest)
        run: docker build -t homestay-es-ik:test -f src/test/resources/testcontainers/Dockerfile.es-ik .

      - name: Run tests (isolated H2 and containerized ES)
        run: mvn -B test

      - name: Upload surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: homestay-backend/target/surefire-reports/
          retention-days: 7

  frontend-build:
    name: Frontend Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [homestay-front, homestay-admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Quality script regression tests
        run: node --test ../tools/check-frontend-changes.test.mjs

      - name: Full lint
        run: npm run lint:check

      - name: Full format check
        run: npm run format:check

      - name: Check changed-file quality
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          npm run quality:changed -- "$base"

      - name: Frontend tests
        run: npm run test:run

      - name: Type-check & build
        run: npm run build
