name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-test:
    name: Backend Tests (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homestay-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build test ES image (with IK analyzer, needed by EsIntegrationTest)
        run: docker build -t homestay-es-ik:test -f src/test/resources/testcontainers/Dockerfile.es-ik .

      - name: Run tests (isolated H2 and containerized ES)
        run: mvn -B test

      - name: Upload surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: homestay-backend/target/surefire-reports/
          retention-days: 7

  database-migrations:
    name: MySQL installation and upgrade
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.32
        env:
          MYSQL_ROOT_PASSWORD: migration-test-only
        ports:
          - 13316:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmigration-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify empty installation and legacy upgrade
        working-directory: homestay-backend
        env:
          HOMESTAY_MIGRATION_TEST_URL: jdbc:mysql://127.0.0.1:13316/homestay_migration_test_ci?allowPublicKeyRetrieval=true&useSSL=false
          HOMESTAY_MIGRATION_TEST_USER: root
          HOMESTAY_MIGRATION_TEST_PASSWORD: migration-test-only
        run: mvn -B -Dtest=FlywayMySqlMigrationTest test
      - name: Verify data import scripts
        run: python3 -m unittest discover -s tools/database -p 'test_*.py'

  frontend-build:
    name: Frontend Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [homestay-front, homestay-admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Quality script regression tests
        run: node --test ../tools/check-frontend-changes.test.mjs

      - name: Full lint
        run: npm run lint:check

      - name: Full format check
        run: npm run format:check

      - name: Check changed-file quality
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          npm run quality:changed -- "$base"

      - name: Frontend tests
        run: npm run test:run

      - name: Type-check & build
        run: npm run build
